<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kralin Software — Müşteri Önizleme Alanı</title>
  <link rel="icon" type="image/png" href="/images/kralin-logo.png">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --kralin-purple: #9b6dff;
      --kralin-purple-light: #bda3ff;
      --font-kralin: "Satoshi", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    }
    body {
      font-family: var(--font-kralin);
      background-color: #000000;
      color: #f5f5f7;
      letter-spacing: -0.015em;
    }
    .apple-glass {
      background: rgba(18, 18, 20, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .apple-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .apple-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--kralin-purple);
      box-shadow: 0 0 0 4px rgba(155, 109, 255, 0.2);
    }
    .kralin-btn {
      background-color: var(--kralin-purple);
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .kralin-btn:hover {
      background-color: #8c57ff;
      transform: scale(1.005);
    }
    .kralin-btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-6 selection:bg-[#9b6dff]/30">

  <!-- Top Apple Navigation / Brand -->
  <header class="w-full max-w-5xl flex items-center justify-between py-2 text-xs text-neutral-400">
    <div class="flex items-center gap-2.5 tracking-tight">
      <img src="/images/kralin-logo.png" alt="Kralin Software" class="w-6 h-6 rounded-md object-contain">
      <span class="font-extrabold text-white text-xs">Kralin Software</span>
      <span class="text-neutral-700">/</span>
      <span class="text-neutral-400">Client Preview</span>
    </div>
    <div class="text-neutral-500 font-mono text-[11px] hidden sm:block">
      End-to-End Encrypted
    </div>
  </header>

  <!-- Centered Lock Card -->
  <main class="w-full max-w-sm my-auto">
    <div class="apple-glass rounded-3xl p-8 sm:p-9 shadow-2xl relative text-center">
      
      <!-- Kralin Logo Badge -->
      <div class="w-14 h-14 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mx-auto mb-6 p-2.5 shadow-inner">
        <img src="/images/kralin-logo.png" alt="Kralin" class="w-full h-full object-contain">
      </div>

      <!-- Headers -->
      <div class="space-y-1.5 mb-8">
        <h1 id="clientCompanyName" class="text-xl sm:text-2xl font-bold tracking-tight text-white">
          Web Sitesi Önizleme
        </h1>
        <p class="text-xs text-neutral-400 leading-relaxed font-normal">
          Firmanız için tasarlanan demoyu incelemek için lütfen Kralin ekibi tarafından iletilen şifreyi giriniz.
        </p>
      </div>

      <!-- Password Form -->
      <form id="verifyForm" class="space-y-4 text-left">
        <div>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              required 
              placeholder="Erişim Şifresi"
              class="apple-input w-full px-4 py-3 rounded-xl text-center text-sm font-mono tracking-widest text-white placeholder:text-neutral-500 placeholder:font-sans placeholder:tracking-normal focus:outline-none"
              autofocus
            >
            <button 
              type="button" 
              id="togglePassBtn"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-neutral-300 text-xs p-1"
              title="Göster"
            >
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div id="errorAlert" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl p-3 text-center">
          <span id="errorText">Girdiğiniz şifre hatalı.</span>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="kralin-btn w-full py-3 px-4 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer shadow-sm"
        >
          <span>Önizlemeyi Başlat</span>
          <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </form>

      <!-- Bottom Support Link -->
      <div class="mt-8 pt-6 border-t border-white/5 text-center">
        <a 
          id="supportWhatsApp" 
          target="_blank" 
          href="https://wa.me/905446014765?text=Merhaba%2C%20Kralin%20Software%20web%20sitesi%20demo%20%C5%9Fifremi%20%C3%B6%C4%9Frenmek%20istiyorum." 
          class="inline-flex items-center gap-1.5 text-xs text-neutral-400 hover:text-[#bda3ff] transition"
        >
          <i class="fa-brands fa-whatsapp text-emerald-400"></i>
          <span>Şifrenizi unuttuysanız ekibe yazın</span>
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-4 text-neutral-600 text-xs">
    &copy; Kralin Software Inc. Every idea deserves to become real.
  </footer>

  <script>
    function getSlug() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length >= 2 && pathParts[0] === 'demo') {
        return pathParts[1];
      }
      return window.location.hostname.split('.')[0];
    }

    const currentSlug = getSlug();
    const companyTitle = document.getElementById('clientCompanyName');
    const form = document.getElementById('verifyForm');
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorText = document.getElementById('errorText');
    const submitBtn = document.getElementById('submitBtn');

    toggleBtn.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      toggleBtn.innerHTML = isPass ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
    });

    async function loadMeta() {
      try {
        const res = await fetch(`/api/demo-meta/${currentSlug}`);
        if (res.ok) {
          const data = await res.json();
          companyTitle.textContent = data.name;
          document.title = `${data.name} — Demo | Kralin Software`;

          if (data.company?.phone) {
            const rawPhone = data.company.phone.replace(/\D/g, '');
            const phone = rawPhone.startsWith('90') ? rawPhone : (rawPhone.startsWith('0') ? '9' + rawPhone : '90' + rawPhone);
            document.getElementById('supportWhatsApp').href = `https://wa.me/${phone}?text=${encodeURIComponent('Merhaba, Kralin Software web sitesi demo şifremi öğrenmek istiyorum.')}`;
          }
        }
      } catch (e) {}
    }
    loadMeta();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Doğrulanıyor...';

      try {
        const res = await fetch(`/api/client/verify/${currentSlug}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passInput.value })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.reload();
        } else {
          errorText.textContent = data.error || 'Şifre hatalı!';
          errorAlert.classList.remove('hidden');
          passInput.focus();
        }
      } catch (err) {
        errorText.textContent = 'Bağlantı hatası oluştu.';
        errorAlert.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Önizlemeyi Başlat</span><i class="fa-solid fa-arrow-right text-[10px]"></i>';
      }
    });
  </script>
</body>
</html>
